# Pedidos360 - ms-carrito (produccion / RDS) - PLACEHOLDERS, sin valores reales
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://__RDS_ENDPOINT__:5432/__RDS_DB_NAME__}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:__RDS_USERNAME__}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:__RDS_PASSWORD__}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD estilo visto en clase - obligatorio en prod: exporta AZURE_TENANT_ID
# con el Directory (tenant) ID real (jwks = issuer-uri + tenant-id + /discovery/v2.0/keys).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID}
