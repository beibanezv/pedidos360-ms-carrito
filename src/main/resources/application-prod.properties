# Pedidos360 - ms-carrito (produccion / RDS) - PLACEHOLDERS, sin valores reales
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://__RDS_ENDPOINT__:5432/__RDS_DB_NAME__}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:__RDS_USERNAME__}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:__RDS_PASSWORD__}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Produccion exige los cuatro valores publicos del proveedor elegido (C1 los
# inyecta por entorno). Sin ellos falla la configuracion antes de abrir DB o broker.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID}
azure.audience=${AZURE_AUDIENCE}
# Cognito: JWKS real del pool, su issuer exacto y su client id.
cognito.jwks-uri=${COGNITO_JWKS_URI}
cognito.issuer=${COGNITO_ISSUER}
cognito.client-id=${COGNITO_CLIENT_ID}
# Orígenes CORS coma-separados (en EC2: la URL https del frontend vía Gateway).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
