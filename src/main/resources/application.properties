# Pedidos360 - ms-carrito (desarrollo local)
server.port=8082

# Postgres local via docker-compose.yml (ms-carrito usa 5433 para convivir con ms-productos en 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/pedidos360_carrito
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD - issuer-uri (no hardcodear). Define AZURE_TENANT_JWKS_URI en tu .env local.
# Ej: https://login.microsoftonline.com/${TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_TENANT_JWKS_URI:https://login.microsoftonline.com/common/v2.0}
