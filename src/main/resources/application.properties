# Pedidos360 - ms-carrito (desarrollo local)
server.port=8082

# Postgres local via docker-compose.yml (ms-carrito usa 5433 para convivir con ms-productos en 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/pedidos360_carrito
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD (token v1): la base del JWKS y el tenant siguen siendo los mismos
# nombres de configuración que en los despliegues anteriores.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:common}
azure.audience=${AZURE_AUDIENCE:api://446c57cb-aba2-4b7a-ab01-6f2e6af7d35c}
# Cognito: ID token, token_use=id y audience = client id del pool.
# Si COGNITO_ISSUER se omite, se deriva del JWKS quitando /.well-known/jwks.json.
cognito.jwks-uri=${COGNITO_JWKS_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_A8lrPsDta/.well-known/jwks.json}
cognito.issuer=${COGNITO_ISSUER:}
cognito.client-id=${COGNITO_CLIENT_ID:2ba1fjeai3c2i77sb5dpd7j91m}

# RabbitMQ (cluster local via docker/rabbitmq-cluster/docker-compose.yml de ms-admin).
# En AWS solo cambia RABBITMQ_HOST por la IP privada de la EC2.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
p360.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
p360.productos.url=${PRODUCTOS_URL:http://localhost:8081}

# Salida persistente de orden.creada: confirmación correlacionada por mensaje.
spring.rabbitmq.publisher-confirm-type=correlated
p360.checkout.outbox.delay-ms=2000
