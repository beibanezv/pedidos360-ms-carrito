# Pedidos360 - ms-carrito (desarrollo local)
server.port=8082

# Postgres local via docker-compose.yml (ms-carrito usa 5433 para convivir con ms-productos en 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/pedidos360_carrito
spring.datasource.username=pedidos360
spring.datasource.password=pedidos360
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure AD estilo visto en clase: issuer-uri base + tenant-id (no hardcodear).
# Local: tenant 'common' (sin fetch en startup). Real: define AZURE_TENANT_ID
# con el Directory (tenant) ID del portal.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:common}
# Segundo emisor (AWS Cognito, segunda vía de login): el decoder lo intenta si
# Azure rechaza la firma. Se sobreescribe con COGNITO_JWKS_URI si cambia el pool.
cognito.jwks-uri=${COGNITO_JWKS_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_A8lrPsDta/.well-known/jwks.json}

# RabbitMQ (cluster local via docker/rabbitmq-cluster/docker-compose.yml de ms-admin).
# En AWS solo cambia RABBITMQ_HOST por la IP privada de la EC2.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
