services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-carrito-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos360_carrito
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: pedidos360
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos360 -d pedidos360_carrito"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
